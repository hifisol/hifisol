# HiFi Health Check - Client Inventory Template
#
# Copy for each client: cp example.ini <client-name>.ini
#
# Playbooks target by group:
#   health-check.yml         -> [linux]
#   health-check-windows.yml -> [windows]
#   health-check-macos.yml   -> [macos]

[all:vars]
ansible_ssh_private_key_file=~/.ssh/<client-key>

# --- Linux ---
[linux]
# srv-1  ansible_host=10.0.1.10  ansible_user=deploy

# --- Windows ---
[windows]
# win-1  ansible_host=10.0.2.10

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
# ansible_user=admin
# ansible_password=<vault-encrypted>
ansible_port=5985

# --- macOS ---
[macos]
# mac-1  ansible_host=10.0.3.10  ansible_user=admin
