---
# HiFi Security Audit - Tunable Defaults
#
# Override these per-client by editing this file or passing at runtime:
#   ansible-playbook -i inventory/<client>.ini security-audit.yml -e @vars/defaults.yml

# Approved SSH cryptographic settings (CIS-aligned)
approved_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
approved_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
approved_kex: "curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256"

# Services that should NOT be running
dangerous_services:
  - avahi-daemon
  - cups
  - rpcbind
  - telnet
  - rsh
  - isc-dhcp-server
  - rsync

# Services that MUST be running
required_services:
  - sshd
  - wazuh-agent
  - fail2ban
  - auditd

# Critical file permissions (path: expected mode)
critical_files:
  - { path: "/etc/shadow", mode: "0640" }
  - { path: "/etc/passwd", mode: "0644" }
  - { path: "/etc/gshadow", mode: "0640" }
  - { path: "/etc/group", mode: "0644" }
  - { path: "/etc/ssh/sshd_config", mode: "0600" }
  - { path: "/boot/grub/grub.cfg", mode: "0600" }
