# HiFi Security Audit - Client Inventory Template
#
# Copy this file for each client engagement:
#   cp example.ini <client-name>.ini
#
# Playbooks target by group:
#   security-audit.yml         -> [linux]
#   security-audit-windows.yml -> [windows]
#   security-audit-macos.yml   -> [macos]

[all:vars]
# SSH key for audit access — replace with client-provided key
ansible_ssh_private_key_file=~/.ssh/<client-key>

# Uncomment to set a default user across all hosts
# ansible_user=deploy

# --- Linux Hosts ---
# Playbook: security-audit.yml
[linux]
# srv-1  ansible_host=10.0.1.10  ansible_user=deploy
# srv-2  ansible_host=10.0.1.20  ansible_user=deploy

# --- Windows Hosts ---
# Playbook: security-audit-windows.yml
# Requires pywinrm on the control node: pip install pywinrm
[windows]
# win-1  ansible_host=10.0.2.10
# win-2  ansible_host=10.0.2.20

[windows:vars]
ansible_connection=winrm
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore
# ansible_user=admin
# ansible_password=<vault-encrypted>
ansible_port=5985

# --- macOS Hosts ---
# Playbook: security-audit-macos.yml
# Requires Remote Login enabled on targets (System Preferences > Sharing)
[macos]
# mac-1  ansible_host=10.0.3.10  ansible_user=admin
# mac-2  ansible_host=10.0.3.20  ansible_user=admin
