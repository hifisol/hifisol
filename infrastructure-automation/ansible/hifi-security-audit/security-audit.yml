---
# Security Baseline Assessment Playbook
# Read-only audit — no changes are made to hosts
#
# Tags: ssh, firewall, services, filesystem, patches, auth, audit, network, agents
# Additional: slow (SUID/SGID scan)
#
# Usage:
#   ansible-playbook -i inventory.ini security-audit.yml
#   ansible-playbook -i inventory.ini security-audit.yml -l wazuh-manager
#   ansible-playbook -i inventory.ini security-audit.yml --tags ssh,patches
#   ansible-playbook -i inventory.ini security-audit.yml --skip-tags slow

- name: Security Baseline Assessment
  hosts: linux
  become: true
  gather_facts: true
  vars:
    # Approved SSH cryptographic settings (from CIS benchmark phase 1)
    approved_ciphers: "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com,aes256-ctr,aes192-ctr,aes128-ctr"
    approved_macs: "hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,hmac-sha2-512,hmac-sha2-256"
    approved_kex: "curve25519-sha256,curve25519-sha256@libssh.org,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,ecdh-sha2-nistp521,ecdh-sha2-nistp384,ecdh-sha2-nistp256,diffie-hellman-group-exchange-sha256"
    # Expected file permissions
    critical_files:
      - { path: "/etc/shadow", mode: "0640" }
      - { path: "/etc/passwd", mode: "0644" }
      - { path: "/etc/gshadow", mode: "0640" }
      - { path: "/etc/group", mode: "0644" }
      - { path: "/etc/ssh/sshd_config", mode: "0600" }
      - { path: "/boot/grub/grub.cfg", mode: "0600" }
    # Dangerous services to check are disabled
    dangerous_services:
      - avahi-daemon
      - cups
      - rpcbind
      - telnet
      - rsh
      - isc-dhcp-server
      - rsync
    # Required services
    required_services:
      - sshd
      - wazuh-agent
      - fail2ban
      - auditd
    # Kernel network hardening sysctl keys
    sysctl_checks:
      - { key: "net.ipv4.ip_forward", expected: "0" }
      - { key: "net.ipv4.conf.all.send_redirects", expected: "0" }
      - { key: "net.ipv4.conf.default.send_redirects", expected: "0" }
      - { key: "net.ipv4.conf.all.accept_source_route", expected: "0" }
      - { key: "net.ipv4.conf.default.accept_source_route", expected: "0" }
      - { key: "net.ipv4.conf.all.accept_redirects", expected: "0" }
      - { key: "net.ipv4.conf.default.accept_redirects", expected: "0" }
      - { key: "net.ipv4.conf.all.secure_redirects", expected: "0" }
      - { key: "net.ipv4.conf.default.secure_redirects", expected: "0" }
      - { key: "net.ipv4.conf.all.log_martians", expected: "1" }
      - { key: "net.ipv4.icmp_echo_ignore_broadcasts", expected: "1" }
      - { key: "net.ipv4.conf.all.rp_filter", expected: "1" }
      - { key: "net.ipv4.conf.default.rp_filter", expected: "1" }
      - { key: "net.ipv4.tcp_syncookies", expected: "1" }
      - { key: "net.ipv6.conf.all.accept_ra", expected: "0" }
      - { key: "net.ipv6.conf.default.accept_ra", expected: "0" }
      - { key: "net.ipv6.conf.all.accept_redirects", expected: "0" }
      - { key: "net.ipv6.conf.default.accept_redirects", expected: "0" }
      - { key: "kernel.randomize_va_space", expected: "2" }
    # Audit rules we expect to be present
    expected_audit_rules:
      - "-w /etc/sudoers"
      - "-w /etc/sudoers.d"
      - "-a always,exit -F arch=b64 -S adjtimex -S settimeofday"
      - "-w /etc/group -p wa"
      - "-w /etc/passwd -p wa"
      - "-w /etc/shadow -p wa"
      - "-a always,exit -F arch=b64 -S open -S truncate -S ftruncate"

  tasks:
    # =========================================================================
    # SSH Hardening Checks
    # =========================================================================
    - name: "[SSH] Read sshd_config"
      shell: cat /etc/ssh/sshd_config
      register: sshd_config_raw
      changed_when: false
      tags: [ssh]

    - name: "[SSH] Check PermitRootLogin"
      shell: grep -i "^PermitRootLogin" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_permit_root
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check PasswordAuthentication"
      shell: grep -i "^PasswordAuthentication" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_password_auth
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check PermitEmptyPasswords"
      shell: grep -i "^PermitEmptyPasswords" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_empty_passwords
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check MaxAuthTries"
      shell: grep -i "^MaxAuthTries" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_max_auth
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check X11Forwarding"
      shell: grep -i "^X11Forwarding" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_x11
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check AllowTcpForwarding"
      shell: grep -i "^AllowTcpForwarding" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_tcp_fwd
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check ClientAliveInterval"
      shell: grep -i "^ClientAliveInterval" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_alive_interval
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check ClientAliveCountMax"
      shell: grep -i "^ClientAliveCountMax" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_alive_count
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check Protocol"
      shell: grep -i "^Protocol" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_protocol
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check Ciphers"
      shell: grep -i "^Ciphers" /etc/ssh/sshd_config | sed 's/^Ciphers\s*//'
      register: ssh_ciphers
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check MACs"
      shell: grep -i "^MACs" /etc/ssh/sshd_config | sed 's/^MACs\s*//'
      register: ssh_macs
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check KexAlgorithms"
      shell: grep -i "^KexAlgorithms" /etc/ssh/sshd_config | sed 's/^KexAlgorithms\s*//'
      register: ssh_kex
      changed_when: false
      failed_when: false
      tags: [ssh]

    - name: "[SSH] Check sshd_config file permissions"
      stat:
        path: /etc/ssh/sshd_config
      register: sshd_config_stat
      tags: [ssh]

    - name: "[SSH] Build findings"
      set_fact:
        ssh_findings: >-
          {{
            [
              {
                "check": "PermitRootLogin",
                "status": "PASS" if (ssh_permit_root.stdout | default('') | lower) == "no" else "FAIL",
                "severity": "CRITICAL",
                "detail": "Value: " + (ssh_permit_root.stdout | default('not set')),
                "fix": "Set PermitRootLogin no in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "PasswordAuthentication",
                "status": "PASS" if (ssh_password_auth.stdout | default('') | lower) == "no" else "FAIL",
                "severity": "HIGH",
                "detail": "Value: " + (ssh_password_auth.stdout | default('not set')),
                "fix": "Set PasswordAuthentication no in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "PermitEmptyPasswords",
                "status": "PASS" if (ssh_empty_passwords.stdout | default('') | lower) == "no" else "FAIL",
                "severity": "CRITICAL",
                "detail": "Value: " + (ssh_empty_passwords.stdout | default('not set')),
                "fix": "Set PermitEmptyPasswords no in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "MaxAuthTries",
                "status": "PASS" if (ssh_max_auth.stdout | default('99') | int) <= 4 else "FAIL",
                "severity": "MEDIUM",
                "detail": "Value: " + (ssh_max_auth.stdout | default('not set')),
                "fix": "Set MaxAuthTries 4 in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "X11Forwarding",
                "status": "PASS" if (ssh_x11.stdout | default('') | lower) == "no" else "FAIL",
                "severity": "MEDIUM",
                "detail": "Value: " + (ssh_x11.stdout | default('not set')),
                "fix": "Set X11Forwarding no in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "AllowTcpForwarding",
                "status": "PASS" if (ssh_tcp_fwd.stdout | default('') | lower) == "no" else "FAIL",
                "severity": "MEDIUM",
                "detail": "Value: " + (ssh_tcp_fwd.stdout | default('not set')),
                "fix": "Set AllowTcpForwarding no in /etc/ssh/sshd_config or run cis-benchmark-phase2.yml"
              },
              {
                "check": "ClientAliveInterval",
                "status": "PASS" if (ssh_alive_interval.stdout | default('0') | int) > 0 else "FAIL",
                "severity": "MEDIUM",
                "detail": "Value: " + (ssh_alive_interval.stdout | default('not set')),
                "fix": "Set ClientAliveInterval 300 in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "ClientAliveCountMax",
                "status": "PASS" if (ssh_alive_count.stdout | default('') != '') else "FAIL",
                "severity": "LOW",
                "detail": "Value: " + (ssh_alive_count.stdout | default('not set')),
                "fix": "Set ClientAliveCountMax 0 in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "Ciphers",
                "status": "PASS" if (ssh_ciphers.stdout | default('')) == approved_ciphers else "FAIL",
                "severity": "MEDIUM",
                "detail": "Configured: " + (ssh_ciphers.stdout | default('not set')),
                "fix": "Set approved ciphers in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "MACs",
                "status": "PASS" if (ssh_macs.stdout | default('')) == approved_macs else "FAIL",
                "severity": "MEDIUM",
                "detail": "Configured: " + (ssh_macs.stdout | default('not set')),
                "fix": "Set approved MACs in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "KexAlgorithms",
                "status": "PASS" if (ssh_kex.stdout | default('')) == approved_kex else "FAIL",
                "severity": "MEDIUM",
                "detail": "Configured: " + (ssh_kex.stdout | default('not set')),
                "fix": "Set approved KexAlgorithms in /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              },
              {
                "check": "sshd_config permissions",
                "status": "PASS" if (sshd_config_stat.stat.mode | default('')) == "0600" else "FAIL",
                "severity": "MEDIUM",
                "detail": "Mode: " + (sshd_config_stat.stat.mode | default('unknown')),
                "fix": "chmod 600 /etc/ssh/sshd_config or run cis-benchmark-phase1.yml"
              }
            ]
          }}
      tags: [ssh]

    - name: "[SSH] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ ssh_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [ssh]

    # =========================================================================
    # Firewall Checks
    # =========================================================================
    - name: "[FIREWALL] Check UFW installed"
      command: which ufw
      register: ufw_installed
      changed_when: false
      failed_when: false
      tags: [firewall]

    - name: "[FIREWALL] Check UFW status"
      shell: ufw status verbose
      register: ufw_status
      changed_when: false
      failed_when: false
      when: ufw_installed.rc == 0
      tags: [firewall]

    - name: "[FIREWALL] Check default incoming policy"
      shell: ufw status verbose | grep "Default:" | head -1
      register: ufw_default
      changed_when: false
      failed_when: false
      when: ufw_installed.rc == 0
      tags: [firewall]

    - name: "[FIREWALL] Enumerate open ports"
      shell: ss -tlnp
      register: open_ports
      changed_when: false
      tags: [firewall]

    - name: "[FIREWALL] Build findings"
      set_fact:
        firewall_findings: >-
          {{
            [
              {
                "check": "UFW installed",
                "status": "PASS" if ufw_installed.rc == 0 else "FAIL",
                "severity": "CRITICAL",
                "detail": "UFW " + ("found" if ufw_installed.rc == 0 else "not found"),
                "fix": "apt install ufw && ufw enable, or run server-baseline.yml"
              },
              {
                "check": "UFW active",
                "status": "PASS" if (ufw_status.stdout | default('')) is search('Status: active') else "FAIL",
                "severity": "CRITICAL",
                "detail": (ufw_status.stdout_lines | default(['UFW not checked']) | first),
                "fix": "ufw enable, or run server-baseline.yml --tags firewall"
              },
              {
                "check": "Default incoming deny",
                "status": "PASS" if (ufw_default.stdout | default('')) is search('deny') else "FAIL",
                "severity": "HIGH",
                "detail": (ufw_default.stdout | default('not checked')),
                "fix": "ufw default deny incoming, or run server-baseline.yml --tags firewall"
              }
            ]
          }}
      tags: [firewall]

    - name: "[FIREWALL] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ firewall_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [firewall]

    - name: "[FIREWALL] Open ports listing"
      debug:
        msg: "{{ open_ports.stdout_lines }}"
      tags: [firewall]

    # =========================================================================
    # Service Hardening Checks
    # =========================================================================
    - name: "[SERVICES] Check dangerous services"
      shell: "systemctl is-active {{ item }} 2>/dev/null || echo inactive"
      register: dangerous_svc_results
      changed_when: false
      failed_when: false
      loop: "{{ dangerous_services }}"
      tags: [services]

    - name: "[SERVICES] Check required services"
      shell: "systemctl is-active {{ item }} 2>/dev/null || echo inactive"
      register: required_svc_results
      changed_when: false
      failed_when: false
      loop: "{{ required_services }}"
      tags: [services]

    - name: "[SERVICES] Check failed systemd units"
      shell: systemctl --failed --no-legend --no-pager
      register: failed_units
      changed_when: false
      failed_when: false
      tags: [services]

    - name: "[SERVICES] Build dangerous service findings"
      set_fact:
        services_dangerous_findings: >-
          {{ dangerous_svc_results.results | map(attribute='item') | zip(dangerous_svc_results.results | map(attribute='stdout')) |
             map('list') |
             map('regex_replace', '.*', '') | list | default([]) }}
      tags: [services]

    # Build findings manually to avoid complex filters
    - name: "[SERVICES] Build findings"
      set_fact:
        services_findings: >-
          {{
            (dangerous_svc_results.results | default([]) | selectattr('stdout', 'equalto', 'active') |
             map(attribute='item') | list |
             map('regex_replace', '(.*)', '{"check": "Dangerous service: \1", "status": "FAIL", "severity": "HIGH", "detail": "Service \1 is active", "fix": "systemctl disable --now \1, or run server-baseline.yml --tags services"}') |
             map('from_json') | list)
            +
            (dangerous_svc_results.results | default([]) | rejectattr('stdout', 'equalto', 'active') |
             map(attribute='item') | list |
             map('regex_replace', '(.*)', '{"check": "Dangerous service: \1", "status": "PASS", "severity": "HIGH", "detail": "Service \1 is not active", "fix": "N/A"}') |
             map('from_json') | list)
            +
            (required_svc_results.results | default([]) | selectattr('stdout', 'equalto', 'active') |
             map(attribute='item') | list |
             map('regex_replace', '(.*)', '{"check": "Required service: \1", "status": "PASS", "severity": "HIGH", "detail": "Service \1 is active", "fix": "N/A"}') |
             map('from_json') | list)
            +
            (required_svc_results.results | default([]) | rejectattr('stdout', 'equalto', 'active') |
             map(attribute='item') | list |
             map('regex_replace', '(.*)', '{"check": "Required service: \1", "status": "FAIL", "severity": "HIGH", "detail": "Service \1 is not active", "fix": "systemctl enable --now \1, or run server-baseline.yml"}') |
             map('from_json') | list)
            +
            [
              {
                "check": "Failed systemd units",
                "status": "PASS" if (failed_units.stdout | default('') | length) == 0 else "WARN",
                "severity": "MEDIUM",
                "detail": (failed_units.stdout | default('none')) if (failed_units.stdout | default('') | length) > 0 else "No failed units",
                "fix": "Investigate failed units with: systemctl status <unit>"
              }
            ]
          }}
      tags: [services]

    - name: "[SERVICES] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ services_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [services]

    # =========================================================================
    # Filesystem Checks
    # =========================================================================
    - name: "[FILESYSTEM] Check critical file permissions"
      stat:
        path: "{{ item.path }}"
      register: file_perm_results
      failed_when: false
      loop: "{{ critical_files }}"
      loop_control:
        label: "{{ item.path }}"
      tags: [filesystem]

    - name: "[FILESYSTEM] Check world-writable files in /etc"
      shell: find /etc -xdev -type f -perm -0002 2>/dev/null | head -20
      register: world_writable
      changed_when: false
      failed_when: false
      tags: [filesystem]

    - name: "[FILESYSTEM] Check SUID/SGID binaries"
      shell: find / -xdev \( -perm -4000 -o -perm -2000 \) -type f 2>/dev/null | sort
      register: suid_binaries
      changed_when: false
      failed_when: false
      tags: [filesystem, slow]

    - name: "[FILESYSTEM] Check AIDE installed"
      command: which aide
      register: aide_installed
      changed_when: false
      failed_when: false
      tags: [filesystem]

    - name: "[FILESYSTEM] Build file permission findings"
      set_fact:
        filesystem_findings: >-
          {{
            (file_perm_results.results | default([]) |
             selectattr('stat', 'defined') |
             selectattr('stat.exists', 'equalto', true) | list |
             map(attribute='item') | zip(
               file_perm_results.results | default([]) |
               selectattr('stat', 'defined') |
               selectattr('stat.exists', 'equalto', true) | list |
               map(attribute='stat')
             ) | list | default([]) |
             map('list') | list | default([]) |
             map('regex_replace', '.*', '') | list | default([]))
          }}
      tags: [filesystem]

    # Simpler approach for filesystem findings
    - name: "[FILESYSTEM] Build findings (simple)"
      set_fact:
        filesystem_findings: >-
          {{
            [
              {
                "check": "World-writable files in /etc",
                "status": "PASS" if (world_writable.stdout | default('') | length) == 0 else "WARN",
                "severity": "HIGH",
                "detail": (world_writable.stdout | default('none found')) if (world_writable.stdout | default('') | length) > 0 else "None found",
                "fix": "Review and fix permissions: chmod o-w <file>"
              },
              {
                "check": "AIDE installed",
                "status": "PASS" if (aide_installed.rc | default(1)) == 0 else "FAIL",
                "severity": "MEDIUM",
                "detail": "AIDE " + ("found" if (aide_installed.rc | default(1)) == 0 else "not found"),
                "fix": "apt install aide aide-common && aideinit, or run cis-benchmark-phase2.yml"
              }
            ]
          }}
      tags: [filesystem]

    - name: "[FILESYSTEM] Check each critical file permission"
      set_fact:
        filesystem_perm_findings: >-
          {% set findings = [] %}
          {% for result in file_perm_results.results | default([]) %}
          {%   if result.stat is defined and result.stat.exists %}
          {%     set actual_mode = result.stat.mode %}
          {%     set expected_mode = result.item.mode %}
          {%     set status = "PASS" if actual_mode == expected_mode else "FAIL" %}
          {%     set _ = findings.append({"check": result.item.path + " permissions", "status": status, "severity": "MEDIUM", "detail": "Expected " + expected_mode + ", got " + actual_mode, "fix": "chmod " + expected_mode + " " + result.item.path}) %}
          {%   elif result.stat is defined and not result.stat.exists %}
          {%     set _ = findings.append({"check": result.item.path + " permissions", "status": "SKIP", "severity": "LOW", "detail": "File does not exist", "fix": "N/A"}) %}
          {%   endif %}
          {% endfor %}
          {{ findings }}
      tags: [filesystem]

    - name: "[FILESYSTEM] Merge all filesystem findings"
      set_fact:
        filesystem_findings: "{{ (filesystem_perm_findings | default([])) + (filesystem_findings | default([])) }}"
      tags: [filesystem]

    - name: "[FILESYSTEM] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ filesystem_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [filesystem]

    - name: "[FILESYSTEM] SUID/SGID binaries"
      debug:
        msg: "INFO: {{ suid_binaries.stdout_lines | default([]) | length }} SUID/SGID binaries found. Review list for unauthorized entries."
      when: suid_binaries.stdout_lines is defined
      tags: [filesystem, slow]

    # =========================================================================
    # Patch Status Checks
    # =========================================================================
    - name: "[PATCHES] Check available upgrades"
      shell: apt list --upgradable 2>/dev/null | grep -v "^Listing" | wc -l
      register: upgradable_count
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] List available security upgrades"
      shell: apt list --upgradable 2>/dev/null | grep -v "^Listing"
      register: upgradable_list
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] Check unattended-upgrades installed"
      command: dpkg -s unattended-upgrades
      register: unattended_installed
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] Check unattended-upgrades service"
      shell: systemctl is-active unattended-upgrades 2>/dev/null || echo inactive
      register: unattended_active
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] Check kernel version"
      shell: uname -r
      register: kernel_current
      changed_when: false
      tags: [patches]

    - name: "[PATCHES] Check available kernel"
      shell: apt list --upgradable 2>/dev/null | grep linux-image || echo "none"
      register: kernel_available
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] Check last apt update"
      shell: stat -c %Y /var/lib/apt/lists/partial 2>/dev/null || stat -c %Y /var/cache/apt/pkgcache.bin 2>/dev/null || echo 0
      register: apt_last_update_ts
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] Calculate apt cache age in days"
      shell: "echo $(( ($(date +%s) - {{ apt_last_update_ts.stdout | default('0') }}) / 86400 ))"
      register: apt_cache_age
      changed_when: false
      failed_when: false
      tags: [patches]

    - name: "[PATCHES] Check reboot required"
      stat:
        path: /var/run/reboot-required
      register: reboot_required
      tags: [patches]

    - name: "[PATCHES] Build findings"
      set_fact:
        patches_findings: >-
          {{
            [
              {
                "check": "Available updates",
                "status": "PASS" if (upgradable_count.stdout | default('0') | int) == 0 else "FAIL",
                "severity": "HIGH",
                "detail": (upgradable_count.stdout | default('0')) + " packages upgradable",
                "fix": "apt update && apt upgrade, or run server-baseline.yml --tags updates"
              },
              {
                "check": "Unattended-upgrades installed",
                "status": "PASS" if (unattended_installed.rc | default(1)) == 0 else "FAIL",
                "severity": "HIGH",
                "detail": "unattended-upgrades " + ("installed" if (unattended_installed.rc | default(1)) == 0 else "not installed"),
                "fix": "apt install unattended-upgrades, or run server-baseline.yml --tags updates"
              },
              {
                "check": "Unattended-upgrades active",
                "status": "PASS" if (unattended_active.stdout | default('')) == 'active' else "FAIL",
                "severity": "HIGH",
                "detail": "Service: " + (unattended_active.stdout | default('unknown')),
                "fix": "systemctl enable --now unattended-upgrades"
              },
              {
                "check": "Kernel update available",
                "status": "PASS" if (kernel_available.stdout | default('none')) == 'none' else "WARN",
                "severity": "MEDIUM",
                "detail": "Current: " + (kernel_current.stdout | default('unknown')) + " | Available: " + (kernel_available.stdout | default('none')),
                "fix": "apt upgrade && reboot"
              },
              {
                "check": "Apt cache freshness",
                "status": "PASS" if (apt_cache_age.stdout | default('999') | int) <= 7 else "FAIL",
                "severity": "MEDIUM",
                "detail": (apt_cache_age.stdout | default('unknown')) + " days since last apt update",
                "fix": "apt update"
              },
              {
                "check": "Reboot required",
                "status": "PASS" if not (reboot_required.stat.exists | default(false)) else "WARN",
                "severity": "MEDIUM",
                "detail": "Reboot " + ("required" if (reboot_required.stat.exists | default(false)) else "not required"),
                "fix": "Schedule a maintenance reboot"
              }
            ]
          }}
      tags: [patches]

    - name: "[PATCHES] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ patches_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [patches]

    - name: "[PATCHES] Upgradable packages detail"
      debug:
        msg: "{{ upgradable_list.stdout_lines }}"
      when: (upgradable_count.stdout | default('0') | int) > 0
      tags: [patches]

    # =========================================================================
    # Authentication & Access Control Checks
    # =========================================================================
    - name: "[AUTH] Check libpam-pwquality installed"
      command: dpkg -s libpam-pwquality
      register: pwquality_installed
      changed_when: false
      failed_when: false
      tags: [auth]

    - name: "[AUTH] Check accounts with empty passwords"
      shell: "awk -F: '($2 == \"\" || $2 == \"!\") && $1 != \"root\" {print $1}' /etc/shadow"
      register: empty_password_accounts
      changed_when: false
      failed_when: false
      tags: [auth]

    - name: "[AUTH] Check accounts with UID 0"
      shell: "awk -F: '$3 == 0 {print $1}' /etc/passwd"
      register: uid_zero_accounts
      changed_when: false
      tags: [auth]

    - name: "[AUTH] Check sudo configuration"
      shell: grep -rE "^[^#]" /etc/sudoers /etc/sudoers.d/ 2>/dev/null | grep -v "^$"
      register: sudo_config
      changed_when: false
      failed_when: false
      tags: [auth]

    - name: "[AUTH] Check login banner /etc/issue"
      stat:
        path: /etc/issue
      register: issue_file
      tags: [auth]

    - name: "[AUTH] Check login banner /etc/issue.net"
      stat:
        path: /etc/issue.net
      register: issue_net_file
      tags: [auth]

    - name: "[AUTH] Read /etc/issue content"
      shell: cat /etc/issue
      register: issue_content
      changed_when: false
      failed_when: false
      tags: [auth]

    - name: "[AUTH] Check SSH banner configured"
      shell: grep -i "^Banner" /etc/ssh/sshd_config | awk '{print $2}'
      register: ssh_banner
      changed_when: false
      failed_when: false
      tags: [auth]

    - name: "[AUTH] Build findings"
      set_fact:
        auth_findings: >-
          {{
            [
              {
                "check": "Password quality (libpam-pwquality)",
                "status": "PASS" if (pwquality_installed.rc | default(1)) == 0 else "FAIL",
                "severity": "MEDIUM",
                "detail": "libpam-pwquality " + ("installed" if (pwquality_installed.rc | default(1)) == 0 else "not installed"),
                "fix": "apt install libpam-pwquality, or run cis-benchmark-phase1.yml"
              },
              {
                "check": "Accounts with empty passwords",
                "status": "PASS" if (empty_password_accounts.stdout | default('') | length) == 0 else "FAIL",
                "severity": "CRITICAL",
                "detail": (empty_password_accounts.stdout | default('none')) if (empty_password_accounts.stdout | default('') | length) > 0 else "None found",
                "fix": "Set passwords for flagged accounts or lock them: passwd -l <user>"
              },
              {
                "check": "UID 0 accounts (besides root)",
                "status": "PASS" if (uid_zero_accounts.stdout_lines | default([]) | length) <= 1 else "FAIL",
                "severity": "CRITICAL",
                "detail": "UID 0 accounts: " + (uid_zero_accounts.stdout | default('root')),
                "fix": "Remove unauthorized UID 0 accounts"
              },
              {
                "check": "Login banner (/etc/issue.net)",
                "status": "PASS" if (issue_content.stdout | default('')) is search('[Aa]uthorized') else "FAIL",
                "severity": "MEDIUM",
                "detail": "Banner " + ("contains authorization warning" if (issue_content.stdout | default('')) is search('[Aa]uthorized') else "missing or no authorization text"),
                "fix": "Set login banner, or run cis-benchmark-phase2.yml"
              },
              {
                "check": "SSH Banner directive",
                "status": "PASS" if (ssh_banner.stdout | default('') | length) > 0 else "FAIL",
                "severity": "MEDIUM",
                "detail": "Banner: " + (ssh_banner.stdout | default('not set')),
                "fix": "Set Banner /etc/issue.net in sshd_config, or run cis-benchmark-phase2.yml"
              }
            ]
          }}
      tags: [auth]

    - name: "[AUTH] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ auth_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [auth]

    # =========================================================================
    # Audit & Logging Checks
    # =========================================================================
    - name: "[AUDIT] Check auditd running"
      shell: systemctl is-active auditd 2>/dev/null || echo inactive
      register: auditd_active
      changed_when: false
      failed_when: false
      tags: [audit]

    - name: "[AUDIT] Check auditd enabled"
      shell: systemctl is-enabled auditd 2>/dev/null || echo disabled
      register: auditd_enabled
      changed_when: false
      failed_when: false
      tags: [audit]

    - name: "[AUDIT] Get loaded audit rules"
      shell: auditctl -l 2>/dev/null || echo "auditctl not available"
      register: audit_rules_loaded
      changed_when: false
      failed_when: false
      tags: [audit]

    - name: "[AUDIT] Check logrotate configured"
      stat:
        path: /etc/logrotate.conf
      register: logrotate_conf
      tags: [audit]

    - name: "[AUDIT] Check rsyslog running"
      shell: systemctl is-active rsyslog 2>/dev/null || echo inactive
      register: rsyslog_active
      changed_when: false
      failed_when: false
      tags: [audit]

    - name: "[AUDIT] Build findings"
      set_fact:
        audit_findings: >-
          {{
            [
              {
                "check": "auditd running",
                "status": "PASS" if (auditd_active.stdout | default('')) == 'active' else "FAIL",
                "severity": "HIGH",
                "detail": "auditd: " + (auditd_active.stdout | default('unknown')),
                "fix": "systemctl enable --now auditd, or run server-baseline.yml --tags audit"
              },
              {
                "check": "auditd enabled at boot",
                "status": "PASS" if (auditd_enabled.stdout | default('')) == 'enabled' else "FAIL",
                "severity": "HIGH",
                "detail": "auditd: " + (auditd_enabled.stdout | default('unknown')),
                "fix": "systemctl enable auditd"
              },
              {
                "check": "Audit rules: sudoers monitoring",
                "status": "PASS" if (audit_rules_loaded.stdout | default('')) is search('/etc/sudoers') else "FAIL",
                "severity": "MEDIUM",
                "detail": "sudoers audit rule " + ("present" if (audit_rules_loaded.stdout | default('')) is search('/etc/sudoers') else "missing"),
                "fix": "Add sudoers.rules to /etc/audit/rules.d/, or run cis-benchmark-phase2.yml"
              },
              {
                "check": "Audit rules: time changes",
                "status": "PASS" if (audit_rules_loaded.stdout | default('')) is search('adjtimex') else "FAIL",
                "severity": "MEDIUM",
                "detail": "Time change audit rule " + ("present" if (audit_rules_loaded.stdout | default('')) is search('adjtimex') else "missing"),
                "fix": "Add time.rules to /etc/audit/rules.d/, or run cis-benchmark-phase2.yml"
              },
              {
                "check": "Audit rules: user/group changes",
                "status": "PASS" if (audit_rules_loaded.stdout | default('')) is search('/etc/passwd') else "FAIL",
                "severity": "MEDIUM",
                "detail": "User/group audit rule " + ("present" if (audit_rules_loaded.stdout | default('')) is search('/etc/passwd') else "missing"),
                "fix": "Add usergroup.rules to /etc/audit/rules.d/, or run cis-benchmark-phase1.yml"
              },
              {
                "check": "Log rotation configured",
                "status": "PASS" if (logrotate_conf.stat.exists | default(false)) else "FAIL",
                "severity": "MEDIUM",
                "detail": "logrotate.conf " + ("exists" if (logrotate_conf.stat.exists | default(false)) else "missing"),
                "fix": "apt install logrotate"
              },
              {
                "check": "Syslog (rsyslog) running",
                "status": "PASS" if (rsyslog_active.stdout | default('')) == 'active' else "FAIL",
                "severity": "HIGH",
                "detail": "rsyslog: " + (rsyslog_active.stdout | default('unknown')),
                "fix": "systemctl enable --now rsyslog"
              }
            ]
          }}
      tags: [audit]

    - name: "[AUDIT] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ audit_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [audit]

    # =========================================================================
    # Network Security Checks
    # =========================================================================
    - name: "[NETWORK] Check sysctl values"
      shell: "sysctl -n {{ item.key }} 2>/dev/null || echo 'not set'"
      register: sysctl_results
      changed_when: false
      failed_when: false
      loop: "{{ sysctl_checks }}"
      loop_control:
        label: "{{ item.key }}"
      tags: [network]

    - name: "[NETWORK] Build findings"
      set_fact:
        network_findings: >-
          {% set findings = [] %}
          {% for result in sysctl_results.results | default([]) %}
          {%   set actual = result.stdout | default('not set') | trim %}
          {%   set expected = result.item.expected %}
          {%   set key = result.item.key %}
          {%   if key == 'net.ipv4.ip_forward' %}
          {%     set sev = "MEDIUM" %}
          {%   elif key == 'net.ipv4.tcp_syncookies' %}
          {%     set sev = "LOW" %}
          {%   elif 'redirect' in key %}
          {%     set sev = "LOW" %}
          {%   else %}
          {%     set sev = "LOW" %}
          {%   endif %}
          {%   set status = "PASS" if actual == expected else "FAIL" %}
          {%   set _ = findings.append({"check": key, "status": status, "severity": sev, "detail": "Expected " + expected + ", got " + actual, "fix": "sysctl -w " + key + "=" + expected + ", or run cis-benchmark-phase1.yml"}) %}
          {% endfor %}
          {{ findings }}
      tags: [network]

    - name: "[NETWORK] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ network_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [network]

    # =========================================================================
    # Security Agent Status Checks
    # =========================================================================
    - name: "[AGENTS] Check Wazuh agent status"
      shell: systemctl is-active wazuh-agent 2>/dev/null || echo inactive
      register: wazuh_status
      changed_when: false
      failed_when: false
      tags: [agents]

    - name: "[AGENTS] Check Wazuh agent connection"
      shell: /var/ossec/bin/agent_control -i 2>/dev/null | grep -i status || /var/ossec/bin/wazuh-control status 2>/dev/null || echo "unable to check"
      register: wazuh_connection
      changed_when: false
      failed_when: false
      tags: [agents]

    - name: "[AGENTS] Check Tailscale status"
      shell: tailscale status --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('BackendState','unknown'))" 2>/dev/null || echo "not installed"
      register: tailscale_status
      changed_when: false
      failed_when: false
      tags: [agents]

    - name: "[AGENTS] Check fail2ban status"
      shell: systemctl is-active fail2ban 2>/dev/null || echo inactive
      register: fail2ban_status
      changed_when: false
      failed_when: false
      tags: [agents]

    - name: "[AGENTS] Check fail2ban jails"
      shell: fail2ban-client status 2>/dev/null | grep "Jail list" || echo "no jails"
      register: fail2ban_jails
      changed_when: false
      failed_when: false
      tags: [agents]

    - name: "[AGENTS] Build findings"
      set_fact:
        agents_findings: >-
          {{
            [
              {
                "check": "Wazuh agent",
                "status": "PASS" if (wazuh_status.stdout | default('')) == 'active' else "FAIL",
                "severity": "HIGH",
                "detail": "wazuh-agent: " + (wazuh_status.stdout | default('unknown')),
                "fix": "systemctl enable --now wazuh-agent"
              },
              {
                "check": "Tailscale",
                "status": "PASS" if (tailscale_status.stdout | default('')) == 'Running' else "WARN",
                "severity": "MEDIUM",
                "detail": "Tailscale: " + (tailscale_status.stdout | default('unknown')),
                "fix": "Install and configure Tailscale"
              },
              {
                "check": "Fail2ban",
                "status": "PASS" if (fail2ban_status.stdout | default('')) == 'active' else "FAIL",
                "severity": "HIGH",
                "detail": "fail2ban: " + (fail2ban_status.stdout | default('unknown')),
                "fix": "systemctl enable --now fail2ban, or run server-baseline.yml --tags security"
              },
              {
                "check": "Fail2ban jails",
                "status": "PASS" if (fail2ban_jails.stdout | default('')) is search('sshd') else "WARN",
                "severity": "MEDIUM",
                "detail": (fail2ban_jails.stdout | default('no jails configured')),
                "fix": "Configure fail2ban jails in /etc/fail2ban/jail.local"
              }
            ]
          }}
      tags: [agents]

    - name: "[AGENTS] Display results"
      debug:
        msg: "{{ item.status }} [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ agents_findings }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [agents]

    # =========================================================================
    # Aggregate all findings for report
    # =========================================================================
    - name: "[SUMMARY] Aggregate all findings"
      set_fact:
        all_findings: >-
          {{
            (ssh_findings | default([])) +
            (firewall_findings | default([])) +
            (services_findings | default([])) +
            (filesystem_findings | default([])) +
            (patches_findings | default([])) +
            (auth_findings | default([])) +
            (audit_findings | default([])) +
            (network_findings | default([])) +
            (agents_findings | default([]))
          }}
      tags: [always]

    - name: "[SUMMARY] Count results"
      set_fact:
        pass_count: "{{ all_findings | selectattr('status', 'equalto', 'PASS') | list | length }}"
        fail_count: "{{ all_findings | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        warn_count: "{{ all_findings | selectattr('status', 'equalto', 'WARN') | list | length }}"
        critical_count: "{{ all_findings | selectattr('severity', 'equalto', 'CRITICAL') | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        high_count: "{{ all_findings | selectattr('severity', 'equalto', 'HIGH') | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        medium_count: "{{ all_findings | selectattr('severity', 'equalto', 'MEDIUM') | selectattr('status', 'equalto', 'FAIL') | list | length }}"
        low_count: "{{ all_findings | selectattr('severity', 'equalto', 'LOW') | selectattr('status', 'equalto', 'FAIL') | list | length }}"
      tags: [always]

    - name: "[SUMMARY] Display summary"
      debug:
        msg:
          - "========================================="
          - "  SECURITY AUDIT SUMMARY: {{ inventory_hostname }}"
          - "========================================="
          - "  PASS: {{ pass_count }} | FAIL: {{ fail_count }} | WARN: {{ warn_count }}"
          - "  CRITICAL fails: {{ critical_count }}"
          - "  HIGH fails:     {{ high_count }}"
          - "  MEDIUM fails:   {{ medium_count }}"
          - "  LOW fails:      {{ low_count }}"
          - "========================================="
      tags: [always]

    - name: "[SUMMARY] List failed checks"
      debug:
        msg: "FAIL [{{ item.severity }}] {{ item.check }} — {{ item.detail }}"
      loop: "{{ all_findings | selectattr('status', 'equalto', 'FAIL') | list }}"
      loop_control:
        label: "{{ item.check }}"
      tags: [always]

# =============================================================================
# Report Generation (runs on localhost)
# =============================================================================
- name: Generate Security Audit Report
  hosts: localhost
  connection: local
  gather_facts: true
  tags: [always]
  vars:
    report_date: "{{ ansible_date_time.date }}"
    report_dir: "{{ lookup('env', 'HOME') }}/HiFi Solutions/hifi-security-audit/reports"
    report_file: "{{ report_dir }}/security-audit-{{ ansible_date_time.date }}.md"

  tasks:
    - name: "[REPORT] Create reports directory"
      file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: "[REPORT] Generate markdown report"
      template:
        src: templates/security-report.md.j2
        dest: "{{ report_file }}"
        mode: "0644"

    - name: "[REPORT] Report location"
      debug:
        msg: "Security audit report written to: {{ report_file }}"
